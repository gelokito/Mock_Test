<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Personality Midterm Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column that reads like her pink transes. A masthead with a pink rule, centered pink banner bars for sections, flat square-cornered cards. Boldness lives in the banner bars only. */
:root {
  --bg: #fff7f9;
  --surface: #ffffff;
  --ink: #2b1721;
  --muted: #7b5d6a;
  --line: #f2d5df;
  --accent: #ff6b9a;
  --accent-ink: #b8255a;
  --bar: #d6336c;
  --on-bar: #ffffff;
  --tint: #ffe9f0;
  --good: #1b7f55;
  --good-bg: #e3f6ec;
  --bad: #b3261e;
  --bad-bg: #fde8e6;
  --display: 'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif;
  --body: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1015;
    --surface: #251820;
    --ink: #fbe9f0;
    --muted: #c8a6b5;
    --line: #3d2833;
    --accent: #ff7aa5;
    --accent-ink: #ff9bbd;
    --bar: #c2275f;
    --on-bar: #ffffff;
    --tint: #33202a;
    --good: #5ad19a;
    --good-bg: #17332a;
    --bad: #ff8a80;
    --bad-bg: #3b1d1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1015;
  --surface: #251820;
  --ink: #fbe9f0;
  --muted: #c8a6b5;
  --line: #3d2833;
  --accent: #ff7aa5;
  --accent-ink: #ff9bbd;
  --bar: #c2275f;
  --on-bar: #ffffff;
  --tint: #33202a;
  --good: #5ad19a;
  --good-bg: #17332a;
  --bad: #ff8a80;
  --bad-bg: #3b1d1d;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5; }
* { box-sizing: border-box; }
.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }

/* masthead */
.masthead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 16px; padding-bottom: 10px; border-bottom: 3px solid var(--accent); }
.masthead h1 { font: 400 clamp(2.5rem, 9vw, 4.4rem)/0.95 var(--display); color: var(--accent-ink); letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.sem { font: 600 0.7rem/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: right; }
.byline { font-size: 0.85rem; color: var(--muted); margin: 10px 0 0; }

.banner { background: var(--bar); color: var(--on-bar); font: 400 1.3rem/1.2 var(--display); letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 14px; text-align: center; margin: 26px 0 14px; }

/* settings */
.settings { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 0 0 4px; }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 0.9rem; cursor: pointer; min-width: 0; }
.check input { width: 1.15rem; height: 1.15rem; margin: 0.15rem 0 0; accent-color: var(--bar); flex: none; }
.check small { display: block; color: var(--muted); font-size: 0.78rem; }

/* set cards */
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.set { appearance: none; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; }
.set:hover { border-color: var(--accent); background: var(--tint); }
.set h3 { font: 400 1.75rem/1 var(--display); letter-spacing: 0.02em; margin: 0; }
.set .sub { font-size: 0.8rem; color: var(--muted); }
.set .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.75rem; font-weight: 600; margin-top: 8px; }
.set .best { color: var(--accent-ink); }
.set.wide { grid-column: 1 / -1; background: var(--tint); border-color: var(--accent); }
.foot { font-size: 0.8rem; color: var(--muted); margin-top: 22px; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* quiz */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.topbar .name { font: 400 1.4rem/1 var(--display); letter-spacing: 0.04em; color: var(--accent-ink); min-width: 0; overflow-wrap: anywhere; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.95rem; }
.timer.low { color: var(--bad); }
.btn { appearance: none; font: 600 0.88rem/1.2 var(--body); letter-spacing: 0.04em; padding: 11px 18px; border-radius: 3px; border: 2px solid var(--bar); background: var(--bar); color: var(--on-bar); cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent-ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }
.btn.small { padding: 7px 12px; font-size: 0.8rem; }
.quitbox { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--bad-bg); border: 1px solid var(--bad); padding: 10px 14px; margin-bottom: 12px; font-size: 0.88rem; }
.progress { height: 6px; background: var(--line); }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
.counter { display: flex; justify-content: space-between; gap: 12px; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 8px 0 16px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 18px 16px 20px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.pill { font: 600 0.68rem/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border: 1px solid var(--line); color: var(--muted); }
.pill.type { background: var(--tint); color: var(--accent-ink); border-color: var(--accent); }
.q { font-size: 1.12rem; font-weight: 600; line-height: 1.45; margin: 0 0 16px; text-wrap: pretty; }

.opts { display: grid; gap: 10px; }
.opt { appearance: none; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 3px; padding: 10px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--tint); }
.opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
.opt .letter { font: 400 1.3rem/1 var(--display); width: 2rem; height: 2rem; display: grid; place-items: center; border: 1px solid var(--line); color: var(--accent-ink); background: var(--surface); }
.opt .otext { padding-top: 0.28rem; overflow-wrap: anywhere; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .letter { background: var(--good); color: var(--bg); border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .letter { background: var(--bad); color: var(--bg); border-color: var(--bad); }

.field { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px; border: 2px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--ink); }
.field:focus { outline: none; border-color: var(--accent); }
.field:disabled { opacity: 1; }
.field.ok { border-color: var(--good); background: var(--good-bg); }
.field.bad { border-color: var(--bad); background: var(--bad-bg); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.hint { font-size: 0.82rem; color: var(--bad); margin: 8px 0 0; min-height: 1.2em; }

.fb { margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); background: var(--bg); font-size: 0.92rem; }
.fb.ok { border-color: var(--good); background: var(--good-bg); }
.fb.no { border-color: var(--bad); background: var(--bad-bg); }
.fb .verdict { font: 400 1.35rem/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 6px; }
.fb.ok .verdict { color: var(--good); }
.fb.no .verdict { color: var(--bad); }
.fb p { margin: 4px 0; overflow-wrap: anywhere; }
.fb .why { color: var(--muted); }
.next { margin-top: 16px; display: flex; justify-content: flex-end; }

/* results */
.scorebox { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 22px; margin-bottom: 6px; }
.score { font: 400 clamp(4.2rem, 18vw, 7rem)/0.85 var(--display); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.score small { font-size: 0.4em; color: var(--muted); }
.verdict-line { font: 400 1.7rem/1.05 var(--display); letter-spacing: 0.03em; margin: 0; }
.sweet { color: var(--muted); margin: 6px 0 0; }
.rows { display: grid; gap: 8px; margin: 4px 0 0; }
.row { display: grid; grid-template-columns: minmax(5.5rem, 8rem) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.85rem; font-weight: 600; }
.track { height: 10px; background: var(--line); }
.track > i { display: block; height: 100%; background: var(--accent); }
.row .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.missed { display: grid; gap: 8px; }
details { border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }
details p { margin: 8px 0 0; font-size: 0.9rem; overflow-wrap: anywhere; }
details .why { color: var(--muted); }
.endactions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

@media (max-width: 460px) {
  .sem { text-align: left; }
  .row { grid-template-columns: 5rem minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) {
  .progress > i { transition: none; }
}
</style>

<main class="app" id="app"></main>

<script>
const DATA = {"general":[{"t":"id","q":"The word 'personality' comes from the Latin word 'persona'. What does persona mean?","a":["mask","a mask"],"e":"Your transes: personality comes from 'persona', the Latin word for mask."},{"t":"mc","q":"Which best defines personality?","o":["A pattern of relatively permanent traits and unique characteristics that give consistency and individuality to behavior","A set of related assumptions used to form testable hypotheses","A classification of people according to natural relationships","A person's temporary moods across different situations"],"e":"Personality is a pattern of relatively permanent traits and unique characteristics that give both consistency and individuality to a person's behavior."},{"t":"mc","q":"Which is the definition of a theory?","o":["A set of related assumptions that lets scientists use logical deductive reasoning to formulate testable hypotheses","A specific guess that can be tested with the scientific method","A broad system of thought that does not need data","A classification of things by natural relationships"],"e":"A theory is a set of related assumptions that allows deductive reasoning to produce testable hypotheses."},{"t":"id","q":"What do you call a specific guess that can be tested using the scientific method?","a":["hypothesis"],"e":"That is a hypothesis. Philosophy is broader than a theory, speculation must be tied to data, and taxonomy is classification."},{"t":"id","q":"What do you call the classification of things according to natural relationships?","a":["taxonomy"],"e":"Taxonomy is classification according to natural relationships."},{"t":"id","q":"Which relative of theory is broader than a theory?","a":["philosophy"],"e":"Philosophy is broader than a theory."},{"t":"mc","q":"Speculation is useful to science only when it is:","o":["Tied to empirical data and science","Broader than a philosophy","Classified by natural relationships","Written as a single testable guess"],"e":"Speculation must be tied to empirical data and science."},{"t":"mc","q":"Which is NOT given as a reason why there are different personality theories?","o":["Every theorist observes exactly the same data","Different personal backgrounds","Different philosophical orientations","Unique ways of looking at the world"],"e":"The data theorists choose to observe is different. The other three options are all listed reasons."},{"t":"id","q":"What is the empirical study of the scientific thought and behavior of the scientist, including theory construction?","a":["psychology of science"],"e":"Psychology of science explains how a theorist's personality influences the theory they develop."},{"t":"mc","q":"Which is NOT one of the criteria for evaluating a theory?","o":["Is popular with the public","Generates research","Is falsifiable","Is parsimonious"],"e":"The criteria are: generates research, falsifiable, organizes known data, guides action, internally consistent, parsimonious."},{"t":"id","q":"Which criterion for a useful theory refers to being practical?","a":["guides action","guide action","guides actions"],"e":"A theory that guides action is practical for the teacher, parent, therapist or other practitioner."},{"t":"mc","q":"Which is NOT one of the dimensions for a concept of humanity?","o":["Introversion v. Extraversion","Determinism v. Free choice","Pessimism v. Optimism","Uniqueness v. Similarities"],"e":"The dimensions are determinism v. free choice, pessimism v. optimism, causality v. teleology, conscious v. unconscious, biological v. social, and uniqueness v. similarities."},{"t":"mc","q":"In the dimensions for a concept of humanity, 'Biological' is paired with:","o":["Social influence on personality","Free choice","Optimism","Similarities"],"e":"Biological v. social influence on personality is one of the dimensions."},{"t":"id","q":"In the dimensions for a concept of humanity, Uniqueness is paired with ___.","a":["similarities","similarity"],"e":"Uniqueness v. similarities is the last dimension in your list."},{"t":"mc","q":"Which are the two empirical criteria for personality instruments?","o":["Reliability and validity","Reliability and falsifiability","Validity and parsimony","Consistency and optimism"],"e":"Instruments are judged on reliability and validity."},{"t":"id","q":"What term refers to the consistency of measures?","a":["reliability"],"e":"Reliability is the consistency of measures."},{"t":"id","q":"Which kind of validity is shown when a test forecasts future behavior?","a":["predictive validity","predictive"],"e":"Predictive validity is one kind of validity. Construct validity covers convergent, divergent and discriminant."},{"t":"mc","q":"Unique qualities such as temperament, physique and intelligence are examples of personality:","o":["Characteristics","Traits","Hypotheses","Taxonomies"],"e":"Characteristics are unique qualities. Traits are about consistency, individual differences and stability across situations."},{"t":"mc","q":"Which is NOT listed as a trait of personality?","o":["Changing completely from moment to moment","Consistency over time","Individual differences in behavior","Stability across situations"],"e":"Traits give consistency, individual differences and stability. Constant change would contradict them."},{"t":"mc","q":"Childhood experience and interpersonal relationships explain different theories because theorists have different:","o":["Personal backgrounds","Philosophical orientations","Chosen data","Taxonomies"],"e":"Different personal background (childhood experience, interpersonal relationships) is the first reason for different theories."}],"freud":[{"t":"mc","q":"Where and when was Freud born?","o":["Freiberg, Moravia, 1856","Vienna, Austria, 1870","Zurich, Switzerland, 1875","Frankfurt, Germany, 1900"],"e":"Freud was born in Freiberg, Moravia (now the Czech Republic) in 1856."},{"t":"id","q":"In which city did Freud spend most of his 80 years?","a":["vienna","vienna austria"],"e":"He lived most of his life in Vienna and died in London."},{"t":"id","q":"With which two people did Freud study hysteria?","a":["charcot breuer"],"e":"This work led to Studies on Hysteria (1895).","k":["charcot","breuer"],"d":"Charcot and Breuer"},{"t":"id","q":"In 1897 Freud abandoned the seduction theory and replaced it with the ___ complex.","a":["oedipus","oedipus complex","oedipal","oedipal complex"],"e":"He dropped the seduction theory in 1897 in favor of the Oedipus complex.","d":"Oedipus complex"},{"t":"id","q":"Which book did Freud write in 1900?","a":["the interpretation of dreams","interpretation of dreams"],"e":"The Interpretation of Dreams came out in 1900. Studies on Hysteria was 1895."},{"t":"mc","q":"Which pair were among the followers in Freud's international circle after 1900?","o":["Adler and Jung","Horney and Fromm","Klein and Bowlby","Kohut and Mahler"],"e":"Adler and Jung were early followers who later left him."},{"t":"mc","q":"Where and when did Freud die?","o":["London, 1939","Vienna, 1936","Scotland, 1937","Zurich, 1961"],"e":"Driven out of Austria by the Nazis, Freud died in London in 1939."},{"t":"id","q":"What are the two cornerstones of psychoanalytic theory?","a":["sex aggression"],"e":"Sex and aggression are the cornerstones that made the theory interesting.","k":["sex","aggress"],"d":"Sex and aggression"},{"t":"id","q":"Freud's brilliant language earned him which prize in literature?","a":["goethe prize"],"e":"Brilliant language, which won the Goethe Prize in Literature, is listed as one reason the theory spread.","k":["goethe"],"d":"Goethe Prize in Literature"},{"t":"id","q":"Name the two sources of unconscious processes.","a":["repression phylogenetic endowment"],"e":"Unconscious material comes from repression and phylogenetic endowment.","k":["repression","phylogenetic"],"d":"Repression and phylogenetic endowment"},{"t":"id","q":"Which level of mental life is not in conscious awareness but can be brought into it?","a":["preconscious"],"e":"The preconscious is not in awareness now but can be brought into it."},{"t":"mc","q":"Which level of mental life plays only a minor role according to Freud?","o":["Conscious","Unconscious","Preconscious","Phylogenetic"],"e":"Conscious life is directly available but plays a minor role."},{"t":"id","q":"Which province of the mind works on the pleasure principle through the primary process?","a":["id"],"e":"The id follows the pleasure principle."},{"t":"mc","q":"The ego operates on which principle and process?","o":["Reality principle, secondary process","Pleasure principle, primary process","Idealistic principle, conscience","Reality principle, ego-ideal"],"e":"The ego follows the reality principle through the secondary process."},{"t":"id","q":"Which province of the mind contains the conscience and the ego-ideal?","a":["superego","super ego"],"e":"The superego follows the idealistic principle and has two parts: conscience and ego-ideal."},{"t":"id","q":"Name Freud's two drives: the sex drive and the aggression or destructive drive.","a":["libido thanatos"],"e":"Libido is the sex drive. Thanatos is the aggression or destructive drive.","k":["libido","thanatos"],"d":"Libido (sex) and Thanatos (aggression)"},{"t":"mc","q":"Which is NOT one of Freud's three kinds of anxiety?","o":["Existential anxiety","Neurotic anxiety","Moral anxiety","Realistic anxiety"],"e":"Freud listed neurotic, moral and realistic anxiety. Anxiety is an ego-preserving mechanism."},{"t":"mc","q":"Which is NOT one of Freud's defense mechanisms in your transes?","o":["Splitting","Reaction formation","Sublimation","Introjection"],"e":"Splitting belongs to Melanie Klein. Freud's list: repression, reaction formation, displacement, fixation, regression, projection, introjection, sublimation."},{"t":"mc","q":"What is the order of the phases in the infantile period (birth to 5 years)?","o":["Oral, anal, phallic","Anal, oral, phallic","Oral, phallic, anal","Phallic, anal, oral"],"e":"The infantile period goes oral, then anal, then phallic."},{"t":"mc","q":"Castration anxiety belongs to which complex?","o":["Male Oedipus complex","Female Oedipus complex","Inferiority complex","Superiority complex"],"e":"Male Oedipus complex brings castration anxiety. Female Oedipus complex brings penis envy."},{"t":"mc","q":"Penis envy is part of the:","o":["Female Oedipus complex","Male Oedipus complex","Latency period","Maturity stage"],"e":"In the female Oedipus complex the girl experiences penis envy."},{"t":"mc","q":"The latency period runs from:","o":["Age 5 to puberty","Birth to age 5","Puberty to adulthood","Age 35 to 40"],"e":"Latency runs from about 5 years old to puberty."},{"t":"mc","q":"The genital period covers:","o":["Puberty to adulthood","Age 5 to puberty","Birth to age 5","Old age only"],"e":"Genital period: puberty to adulthood, followed by maturity."},{"t":"mc","q":"Which two phenomena can appear during free association?","o":["Transference and resistance","Manifest and latent content","Projection and introjection","Repression and fixation"],"e":"Transference and resistance are listed under free association."},{"t":"mc","q":"In dream analysis, the dream as remembered is the ___ content and its hidden meaning is the ___ content.","o":["manifest; latent","latent; manifest","conscious; preconscious","primary; secondary"],"e":"Dream analysis looks at manifest and latent content."},{"t":"id","q":"Freudian or unconscious slips are also called ___.","a":["parapraxes","parapraxis"],"e":"Freudian or unconscious slips are parapraxes."},{"t":"id","q":"Which theory in the related research explains dreams?","a":["activation synthesis","activation synthesis theory"],"e":"Activation-synthesis theory is the related research on dreams.","d":"Activation-synthesis theory"},{"t":"mc","q":"Research on unconscious mental processing describes the processing as:","o":["Automatic, implicit, nonconscious","Deliberate, explicit, conscious","Slow, effortful, verbal","Random and unmeasurable"],"e":"Related research describes automatic, implicit, nonconscious processing."},{"t":"mc","q":"Which statement matches the critique of Freud?","o":["It generated considerable research but is difficult to falsify","It is easy to falsify and solves practical problems","It has a very tight organizational framework","It is internally inconsistent"],"e":"Critique: generated considerable research, difficult to test or falsify, loose organizational framework, poor guide for practical problems, internally consistent."},{"t":"mc","q":"Freud's concept of humanity is best described as:","o":["Deterministic and pessimistic, favoring the unconscious and biology","Free-choice and optimistic, favoring social interest","Both causal and teleological","Equal emphasis on optimism and pessimism"],"e":"Freud: deterministic, pessimistic, causality over teleology, unconscious over conscious, biology over culture, equal emphasis on uniqueness and similarity."}],"adler":[{"t":"id","q":"In what year was Adler born?","a":["1870"],"e":"Adler was born in a Viennese suburb in 1870."},{"t":"mc","q":"Adler was the ___ of middle-class Jewish parents.","o":["Second son","Eldest son","Youngest child","Only child"],"e":"He was the second son of middle-class Jewish parents."},{"t":"id","q":"In what year did Adler receive his medical degree?","a":["1895"],"e":"Adler received his medical degree in 1895."},{"t":"id","q":"In what year did Adler publish Study of Organ Inferiority and Its Psychical Compensation?","a":["1907"],"e":"This work appeared in 1907."},{"t":"mc","q":"What led to Adler leaving Freud's group?","o":["Rivalry with Freud","A move to the United States","A dispute over Jung","Retirement"],"e":"His rivalry with Freud led to his departure. He then founded the Society for Individual Psychology."},{"t":"id","q":"In which country did Adler die?","a":["scotland"],"e":"Adler died in Scotland in 1937."},{"t":"mc","q":"Which is NOT one of the four ways Adler differed from Freud?","o":["Adler held that sex and aggression are the cornerstones","People are motivated by social influences","People are responsible for who they are","Consciousness is important"],"e":"Adler stressed social influences, personal responsibility, behavior shaped by view of time (future), and consciousness."},{"t":"mc","q":"Individual psychology is best described as:","o":["Optimistic and emphasizing social interest","Pessimistic and emphasizing instinct","Deterministic and emphasizing the unconscious","Biological and emphasizing archetypes"],"e":"The overview says Adler's theory is optimistic and emphasizes social interest."},{"t":"id","q":"According to Adler, what is the force behind all behavior?","a":["striving for success","striving for superiority","striving for success or superiority","striving for superiority or success","striving"],"e":"Striving for success is the force behind behavior.","d":"Striving for success or superiority"},{"t":"mc","q":"Which is the final goal of behavior in Adler's theory?","o":["Striving","Regression","Fixation","Projection"],"e":"Striving is the final goal of behavior, as compensation, for personal superiority or for success."},{"t":"mc","q":"Striving for personal superiority is motivated by:","o":["Personal goals and exaggerated feelings of inferiority","Social interest and community feeling","Basic hostility","The pleasure principle"],"e":"Striving for personal superiority comes from personal goals and large feelings of personal inferiority (an inferiority complex)."},{"t":"mc","q":"Psychologically healthy people strive for success and are motivated by:","o":["Social interest","Neurotic pride","Malignant aggression","Phylogenetic endowment"],"e":"Healthy people strive for success through social interest and tie their worth to contributions to society."},{"t":"id","q":"What is the name of Adler's idea that the final goal is a guiding fiction?","a":["fictionalism"],"e":"Fictionalism: the final goal is a fiction that guides our style of life, unifies personality and makes behavior purposeful."},{"t":"mc","q":"What did Kasler and Nevo (2005) study in the related research?","o":["Early recollections and career choice","Early childhood and health issues","Counseling outcomes","Personality type and investing"],"e":"Kasler and Nevo linked early recollections to career choice."},{"t":"id","q":"What term means that the deficient organ expresses the direction of the individual's goal?","a":["organ dialect"],"e":"Under unity of personality, the deficient organ expresses the direction of the person's goal."},{"t":"mc","q":"A unified personality results from harmony between:","o":["Conscious and unconscious processes aimed at a single goal","Id and superego","Persona and shadow","Libido and Thanatos"],"e":"Unity is harmony between conscious and unconscious processes toward one goal."},{"t":"id","q":"What is the force that binds society together?","a":["social interest","gemeinschaftsgefuhl","community feeling","social feeling"],"e":"Social interest is the force that binds society together."},{"t":"mc","q":"Where is social interest first found and fostered?","o":["Mother-infant relationship and the social environment","Collective unconscious","Phylogenetic endowment","Organ inferiority"],"e":"Its potential is in everyone, is found in the mother-infant relationship, and is fostered by the social environment."},{"t":"mc","q":"Adler called social interest the:","o":["Barometer of normality","Final fiction","Safeguard of the self","Organ of compensation"],"e":"Social interest is the sole criterion of human values and the barometer of normality."},{"t":"id","q":"What does Gemeinschaftsgefuhl mean in English?","a":["social feeling","community feeling","social interest"],"e":"It is a feeling of oneness with all humanity.","d":"Social feeling (community feeling)"},{"t":"mc","q":"Which describes 'style of life'?","o":["The flavor of a person's life, including goal, self-concept, empathy and attitude toward the world","A fixed set of inherited traits","A defense against reality","A stage of psychosexual development"],"e":"Style of life is the flavor of a person's life."},{"t":"id","q":"By what age is style of life mostly set?","a":["4 or 5","4 to 5","4 5","4 or 5 years old","age 4 or 5","4 5 years old"],"e":"Style of life is mostly set by age 4 or 5.","d":"4 or 5 years old"},{"t":"mc","q":"Which is NOT one of the three problems healthy people solve through their style of life?","o":["Religious faith","Neighborly love","Sexual love","Occupation"],"e":"The three are neighborly love, sexual love and occupation."},{"t":"id","q":"What is Adler's term for an inner freedom that empowers each person to create his or her own style of life?","a":["creative power"],"e":"Creative power places one in control of their life and is responsible for the final goal."},{"t":"mc","q":"According to Adler, what matters about creative power?","o":["How one uses it, not what one is endowed with","How much of it one inherits","How early it develops","How little it is used"],"e":"The importance is not endowment but how one uses this power."},{"t":"mc","q":"Which is NOT an external factor in maladjustment?","o":["Safeguarding tendencies","Exaggerated physical deficiencies","Pampered style of life","Neglected style of life"],"e":"The external factors are exaggerated physical deficiencies and pampered or neglected styles of life. Safeguarding tendencies are separate."},{"t":"mc","q":"Which is NOT a safeguarding tendency?","o":["Reaction formation","Excuses","Aggression","Withdrawal"],"e":"Safeguarding tendencies: excuses, aggression and withdrawal."},{"t":"mc","q":"Which is NOT an application of individual psychology?","o":["Word association test","Family constellations","Early recollections","Dreams"],"e":"The word association test is Jung's method. Adler used family constellations, early recollections, dreams and psychotherapy."},{"t":"mc","q":"According to the critique, Adler's theory is low on:","o":["Verification, falsification and internal consistency","Generating research","Organizing known data","Guiding action"],"e":"Adler: high on research, organizing data and guiding action; moderate on parsimony; low on verification, falsification and consistency."},{"t":"mc","q":"Adler's concept of humanity is very high on:","o":["Free choice and optimism","Determinism and pessimism","Causality","Unconscious influences"],"e":"Adler is very high on free choice and optimism, high on social factors and uniqueness, average on the unconscious, very low on causality."}],"jung":[{"t":"mc","q":"Where and when was Jung born?","o":["Kesswil, Switzerland, 1875","Vienna, Austria, 1870","Freiberg, Moravia, 1856","Zurich, Switzerland, 1961"],"e":"Jung was born in Kesswil, Switzerland in 1875, the oldest surviving child of an idealistic Protestant minister."},{"t":"id","q":"Jung was the oldest surviving child of an idealistic Protestant ___.","a":["minister","protestant minister","pastor"],"e":"His father was an idealistic Protestant minister, and his mother's family had a tradition of mysticism."},{"t":"mc","q":"Filbeck, Hatfield and Horvath (2005) found the MBTI to be a good predictor of:","o":["Risk tolerance among types","Dropout from engineering courses","Interest in teaching","Political beliefs in adulthood"],"e":"Related research: MBTI predicted risk tolerance when investing money."},{"t":"id","q":"After receiving his medical degree in 1900, Jung became a psychiatric assistant to whom?","a":["bleuler","eugen bleuler"],"e":"Jung became a psychiatric assistant to Bleuler, then studied with Janet in Paris in 1902-03."},{"t":"mc","q":"Jung studied with Janet in Paris during:","o":["1902-1903","1906","1913","1900"],"e":"Jung studied with Janet in 1902-03."},{"t":"mc","q":"Jung began corresponding with Freud in which year?","o":["1906","1900","1913","1902"],"e":"Jung read Freud's writings and began corresponding with him in 1906. Freud saw Jung as his successor."},{"t":"id","q":"In what year did Jung break with the International Psychoanalytic Association?","a":["1913"],"e":"Jung became disenchanted with Freud's theories and broke away in 1913, then developed analytical psychology."},{"t":"mc","q":"Where and when did Jung die?","o":["Zurich, 1961","London, 1939","Scotland, 1937","New York, 1952"],"e":"Jung died in Zurich in 1961."},{"t":"mc","q":"Which assumption is unique to analytical psychology?","o":["Occult phenomena influence lives","Sex and aggression drive all behavior","Social interest binds society","Basic anxiety comes from neglected needs"],"e":"The overview says Jung assumed occult phenomena influence lives and that we inherit ancestral experiences as the collective unconscious."},{"t":"id","q":"What is the term for ideas from the experiences inherited from our ancestors?","a":["collective unconscious","the collective unconscious"],"e":"The collective unconscious holds ideas from inherited ancestral experiences. Archetypes are highly developed aspects of it."},{"t":"id","q":"Archaic images derived from the collective unconscious are called ___.","a":["archetypes","archetype"],"e":"Archetypes are archaic images from the collective unconscious."},{"t":"mc","q":"Which level of the psyche holds repressed, forgotten or subliminally perceived experiences?","o":["Personal unconscious","Collective unconscious","Conscious","Preconscious"],"e":"That describes the personal unconscious."},{"t":"mc","q":"In Jung's conscious level, psychic images are sensed by the:","o":["Ego","Self","Persona","Shadow"],"e":"The conscious consists of psychic images sensed by the ego."},{"t":"mc","q":"Which is NOT one of Jung's archetypes in your transes?","o":["Superego","Shadow","Anima","Wise Old Man"],"e":"Listed archetypes: persona, shadow, anima, animus, great mother, wise old man, hero, the self. Superego is Freud's."},{"t":"id","q":"Jung said behavior is shaped by both causality and ___.","a":["teleology"],"e":"In the dynamics of personality, behavior is shaped by both causality and teleology."},{"t":"mc","q":"Progression is best described as:","o":["Forward flow of psychic energy needed for adaptation to the outside world","Backward flow of psychic energy needed for the inner world","Turning of psychic energy inward","Integration of opposites into a harmonious self"],"e":"Progression is the forward flow of psychic energy, necessary for adaptation to the outside world."},{"t":"id","q":"What is the backward flow of psychic energy, necessary for adaptation to the inner world?","a":["regression"],"e":"Regression is the backward flow of psychic energy, needed for adaptation to the inner world."},{"t":"id","q":"Which attitude is the turning inward of psychic energy with an orientation toward the subjective?","a":["introversion","introvert","introverted"],"e":"Introversion turns psychic energy inward toward the subjective."},{"t":"mc","q":"Extraversion is:","o":["The turning outward of psychic energy toward the objective","The turning inward of psychic energy toward the subjective","The forward flow of psychic energy","Perception beyond the working of consciousness"],"e":"Extraversion is oriented toward the objective and away from the subjective."},{"t":"mc","q":"Which is NOT one of Jung's four functions?","o":["Memory","Thinking","Sensation","Intuition"],"e":"The four functions are thinking, feeling, sensation and intuition."},{"t":"id","q":"Which function is perception beyond the working of consciousness?","a":["intuition"],"e":"Intuition is perception beyond the working of consciousness."},{"t":"mc","q":"Which function receives physical stimuli and transmits them to perceptual consciousness?","o":["Sensation","Feeling","Thinking","Intuition"],"e":"That is sensation."},{"t":"mc","q":"Which function means evaluating an idea or event?","o":["Feeling","Thinking","Sensation","Intuition"],"e":"Feeling evaluates an idea or event. Thinking is logical intellectual activity producing a chain of ideas."},{"t":"id","q":"Name the three stages of childhood in Jung's development of personality.","a":["anarchic monarchic dualistic"],"e":"Childhood stages: anarchic, monarchic, dualistic.","k":["anarchic","monarchic","dualistic"]},{"t":"mc","q":"Middle life begins at about:","o":["Age 35 to 40","Age 5 to puberty","Age 20 to 25","Age 60"],"e":"Middle life begins around 35 to 40, a period of anxiety and potential."},{"t":"mc","q":"According to your transes, what is the goal of life in old age?","o":["Death","Individuation","Social interest","Reproduction"],"e":"In old age there is a diminution of consciousness, and death is the goal of life."},{"t":"id","q":"What is another term for self-realization, the process of integrating opposites into a harmonious self?","a":["individuation"],"e":"Self-realization (individuation) requires assimilating the unconscious into the total self and is rarely achieved."},{"t":"mc","q":"What is the first stage of Jung's four-stage psychotherapy?","o":["Confession of a pathogenic secret","Interpretation, explanation and elucidation","Education as social beings","Transformation"],"e":"The four stages: confession, interpretation, education, transformation."},{"t":"id","q":"According to the critique, Jung's theory is very low on what criterion?","a":["falsifiability","falsification","falsifiable"],"e":"Jung: moderate on generating research and organizing observations; low on practicality, internal consistency and parsimony; very low on falsifiability."},{"t":"mc","q":"Thomas et al. (2000) found which trait predicted dropout from engineering courses?","o":["Extraversion","Introversion","Thinking","Intuition"],"e":"Extraversion predicted dropout from engineering courses."}],"klein":[{"t":"mc","q":"Where and when was Klein born?","o":["Vienna, 1882","Freiberg, Moravia, 1856","Kesswil, Switzerland, 1875","Eilbek, Germany, 1885"],"e":"Klein was born in Vienna in 1882 and died in England in 1960."},{"t":"mc","q":"Klein was the ___ of four children.","o":["Youngest","Eldest","Second","Only surviving"],"e":"She was the youngest of four children."},{"t":"id","q":"Who introduced Klein to psychoanalysis in 1909?","a":["sandor ferenczi","ferenczi"],"e":"She met Sandor Ferenczi in 1909, and he introduced her to psychoanalysis."},{"t":"mc","q":"Klein was the first in Freud's circle to:","o":["Psychoanalyze children directly","Develop the Strange Situation","Study separation-individuation","Introduce the word association test"],"e":"She was first to psychoanalyze children directly."},{"t":"id","q":"In what year was Klein's The Psycho-Analysis of Children published?","a":["1932"],"e":"The Psycho-Analysis of Children was published in 1932."},{"t":"mc","q":"Object relations theory was built on observations of:","o":["Young children","Adult neurotics","Soldiers","Dream reports"],"e":"It was built on observations of young children."},{"t":"id","q":"In object relations theory, which object is the prototype for later relations?","a":["breast","the breast","mother's breast","good breast"],"e":"The infant's drives are driven by objects, and the breast is the prototype for later relations."},{"t":"mc","q":"Which is NOT one of the ways object relations differs from Freud's instinct theory?","o":["Stresses biological instinct as the sole motive","Emphasizes consistent patterns of interpersonal relationships","Stresses intimacy and maternal nurturing","Treats relatedness as the prime motive of behavior"],"e":"The three differences: interpersonal patterns, intimacy and nurturing, and relatedness as the prime motive."},{"t":"id","q":"What is the prime motive of human behavior in object relations theory?","a":["relatedness"],"e":"Relatedness is the prime motive of human behavior."},{"t":"mc","q":"The most basic fantasies of infants are of what is:","o":["Good and bad","Big and small","Male and female","Safe and unsafe"],"e":"Infants have an active fantasy life, and the most basic fantasies are good and bad (good and bad breast)."},{"t":"mc","q":"Objects that are taken into the child's fantasy world are said to be:","o":["Introjected","Projected","Repressed","Sublimated"],"e":"Objects are introjected into the child's fantasy world and have a life of their own."},{"t":"id","q":"Which position lasts the first 3 to 4 months and involves persecution and splitting objects into good and bad?","a":["paranoid schizoid","paranoid schizoid position"],"e":"The paranoid-schizoid position covers the first 3 to 4 months of life.","d":"Paranoid-schizoid position"},{"t":"mc","q":"The depressive position involves:","o":["Anxiety over losing a loved object and guilt for wanting to destroy it","Persecution and splitting into good and bad","The first three to four months of life","Exhibiting the grandiose self"],"e":"Depressive position: anxiety over losing a loved object, and guilt over wanting to destroy it."},{"t":"mc","q":"Which is NOT one of Klein's psychic defense mechanisms?","o":["Sublimation","Introjection","Splitting","Projective identification"],"e":"Klein's list: introjection, projection, splitting, projective identification."},{"t":"id","q":"Which defense mechanism exists only in real interpersonal relationships, like the husband who projects domineering tendencies onto his wife and behaves submissively to make her act that way?","a":["projective identification"],"e":"Unlike simple projection, projective identification exists only in real interpersonal relationships."},{"t":"mc","q":"Klein's view of the ego differs from Freud's because it:","o":["Matures at a much earlier stage","Matures much later","Does not exist in infancy","Is the same as the id"],"e":"Klein saw the ego as maturing much earlier than in Freud's theory."},{"t":"id","q":"Who observed infant and mother interaction during the first three years and described separation-individuation?","a":["margaret mahler","mahler"],"e":"Mahler's three stages: normal autism, normal symbiosis, separation-individuation."},{"t":"mc","q":"Mahler's separation-individuation stage runs from:","o":["5th to 36th month","Birth to 3-4 weeks","4th week to 5th month","3 to 5 years"],"e":"Normal autism: birth to 3-4 weeks. Normal symbiosis: 4th week to 5th month. Separation-individuation: 5th to 36th month."},{"t":"mc","q":"For Kohut, the self is:","o":["The center of the individual's psychological universe","The product of the Oedipus complex","A mask worn in public","The same as the ego"],"e":"Kohut emphasized development of the self as the center of the psychological universe."},{"t":"id","q":"Kohut's two narcissistic needs are to exhibit the ___ self and to acquire an idealized image of parents.","a":["grandiose","grandiose self"],"e":"The early self has two narcissistic needs: the grandiose self and the idealized parent image."},{"t":"id","q":"Name Bowlby's three stages of separation anxiety.","a":["protest despair detachment"],"e":"Bowlby observed protest, despair and detachment.","k":["protest","despair","detachment"]},{"t":"mc","q":"Which is one of Bowlby's two fundamental assumptions?","o":["The caregiver must create a secure base for the child","The infant is born in a state of symbiosis","The infant's drives are independent of objects","The self is shaped by grandiose needs"],"e":"Bowlby: the caregiver creates a secure base, and the bonding relationship is internalized as a model for future relationships."},{"t":"id","q":"Who developed the Strange Situation technique for measuring attachment style?","a":["mary ainsworth","ainsworth"],"e":"Mary Ainsworth was influenced by Bowlby and developed the Strange Situation."},{"t":"mc","q":"Ainsworth's three basic attachment styles are:","o":["Secure, anxious-resistant, anxious-avoidant","Secure, grandiose, idealized","Toward, against, away","Receptive, exploitative, hoarding"],"e":"Ainsworth found secure, anxious-resistant and anxious-avoidant styles."},{"t":"mc","q":"Klein substituted what for dream work in psychotherapy?","o":["Play therapy","Free association","Word association","Active imagination"],"e":"Klein thought all children should be psychoanalyzed and used play therapy."},{"t":"id","q":"The goal of Kleinian psychotherapy is to reduce depressive anxieties and persecutory fears and lessen the harshness of ___ objects.","a":["internalized","internalised"],"e":"The goal is to lessen the harshness of internalized objects."},{"t":"mc","q":"Hazan and Shaver (1987) found that people with secure attachments experience:","o":["More trust, closeness and positive emotions","Less information seeking","Lower well-being","Disturbed object relations"],"e":"Secure attachments go with more trust, closeness and positive emotions."},{"t":"mc","q":"Rholes et al. (2007) found that:","o":["Avoidant people seek less information about romantic partners and anxious people seek more","Avoidant people seek more information and anxious people seek less","Both styles seek more information","Neither style differs"],"e":"Avoidant individuals seek less information about partners, while anxious individuals seek more."},{"t":"mc","q":"Which pairing matches the critique?","o":["Attachment theory is high on falsifiability; Kleinian theory is low on parsimony","Attachment theory is low on falsifiability; Kleinian theory is high on parsimony","Both are very high on generating research","Both are low on practicality"],"e":"Attachment theory is high on practicality, internal consistency and falsifiability. Kleinian theory is particularly low on parsimony."},{"t":"id","q":"Klein's concept of humanity favors determinism over ___.","a":["free choice"],"e":"Klein: determinism over free choice, equal optimism and pessimism, causality over teleology, unconscious over conscious, social over biology, similarity over uniqueness."}],"horney":[{"t":"id","q":"In what year was Karen Horney born?","a":["1885"],"e":"Horney was born in Eilbek, near Hamburg, in 1885."},{"t":"mc","q":"Horney was the youngest of two children born to:","o":["An older sea captain and his young wife","A Protestant minister and a mystic","Middle-class Jewish parents","Orthodox Jewish parents"],"e":"She was the youngest of two children of an older sea captain and his young wife."},{"t":"id","q":"Horney entered the University of Freiburg in 1906. In which medical specialty did she train?","a":["psychiatry"],"e":"She was one of the first women in Germany admitted to medical school, and specialized in psychiatry."},{"t":"id","q":"Which close associate of Freud analyzed Horney in 1910?","a":["karl abraham","abraham"],"e":"She was analyzed by Karl Abraham in 1910."},{"t":"mc","q":"Horney published The Technique of Psychoanalytic Therapy in:","o":["1917","1932","1950","1910"],"e":"It was published in 1917."},{"t":"mc","q":"In 1932 Horney left Germany to become Associate Director of the:","o":["Chicago Psychoanalytic Institute","South German Institute for Psychoanalysis","Society for Individual Psychology","International Psychoanalytic Association"],"e":"She moved to the Chicago Psychoanalytic Institute in 1932."},{"t":"id","q":"Which book did Horney publish in 1950?","a":["neurosis and human growth"],"e":"Neurosis and Human Growth came out in 1950. She died in New York in 1952."},{"t":"mc","q":"Horney's concept of humanity favors:","o":["Free choice, optimism and social influence","Determinism, pessimism and biology","Unconscious over conscious and causality over teleology","Teleology over causality and uniqueness over similarity"],"e":"Horney: free choice over determinism, optimism over pessimism, social influence over biology, similarities over uniqueness."},{"t":"mc","q":"According to Horney, what is largely responsible for shaping personality?","o":["Social and cultural conditions","Biological instincts","The collective unconscious","Birth order"],"e":"Social and cultural conditions largely shape personality."},{"t":"id","q":"Name the three ways of combating basic anxiety: moving ___ people, ___ people and ___ people.","a":["toward against away"],"e":"The three neurotic trends: moving toward, against and away from people.","k":["toward","against","away"]},{"t":"mc","q":"Which is NOT one of Horney's criticisms of Freud?","o":["Freud overemphasized culture over instinct","Orthodoxy leads to theoretical and clinical stagnation","Freud held inaccurate views of feminine psychology","Psychoanalysis should move beyond instinct and examine culture"],"e":"Horney said Freud stressed instinct too much and should have looked at culture."},{"t":"id","q":"What arises when parents do not satisfy a child's needs for safety and satisfaction?","a":["basic hostility"],"e":"Basic hostility arises from unmet needs for safety and satisfaction."},{"t":"id","q":"Repressed hostility leads to feelings of insecurity and apprehension called:","a":["basic anxiety"],"e":"Basic anxiety is the result of repressed hostility."},{"t":"mc","q":"How many categories of neurotic needs did Horney describe?","o":["10","5","3","8"],"e":"Neurotic needs fall into 10 categories."},{"t":"mc","q":"The compliant personality moves:","o":["Toward people","Against people","Away from people","Beyond people"],"e":"The compliant personality moves toward people, with a basic conflict of helplessness."},{"t":"mc","q":"The aggressive personality is a defense that offers:","o":["Protection against the hostility of others","Relief from feelings of helplessness","Escape from isolation","Support for self-sufficiency"],"e":"Moving against people comes from a need for protection against the hostility of others."},{"t":"id","q":"The detached personality moves ___ people.","a":["away","away from","away from people"],"e":"The detached personality moves away from people, with feelings of isolation.","d":"Away from people"},{"t":"mc","q":"Which neurotic need belongs to moving toward people?","o":["Need for a powerful partner","Need for power","Need to exploit others","Need for self-sufficiency and independence"],"e":"Toward people: affection and approval, powerful partner, narrow limits to life."},{"t":"mc","q":"Which neurotic need belongs to moving away from people?","o":["Need for perfection and unassailability","Need for affection and approval","Need for personal admiration","Need for social recognition"],"e":"Away from people: self-sufficiency and independence, and perfection and unassailability."},{"t":"mc","q":"Intrapsychic conflicts originate from:","o":["Interpersonal experiences","Biological instincts","The collective unconscious","Organ inferiority"],"e":"Horney said intrapsychic conflicts originate from interpersonal experiences."},{"t":"id","q":"Name the three aspects of the idealized self-image: neurotic search for ___, neurotic ___ and neurotic ___.","a":["glory claims pride"],"e":"The idealized self-image has three aspects: neurotic search for glory, neurotic claims and neurotic pride.","k":["glory","claims","pride"]},{"t":"id","q":"The need for perfection in the neurotic search for glory is called the Tyranny of the ___.","a":["should"],"e":"The Tyranny of the should is the relentless demand for perfection."},{"t":"mc","q":"Neurotic claims involve:","o":["Building a fantasy world and wanting to be treated as special","The need for perfection","A drive toward vindictive triumph","A view of the self based on the idealized self"],"e":"Neurotic claims: a fantasy world because something is wrong with the outside world, and a wish to be treated as special."},{"t":"mc","q":"Neurotic pride is a view of the self based on the:","o":["Idealized self","Real self","Collective unconscious","Ancestral past"],"e":"Neurotic pride rests on the idealized self."},{"t":"id","q":"Neurotic individuals dislike themselves because their real self does not match the insatiable demands of their ___ view of self.","a":["idealized","idealized self","idealised"],"e":"This mismatch produces self-hatred."},{"t":"mc","q":"Which is NOT a way self-hatred is expressed?","o":["Self-acceptance","Self-contempt","Self-torment","Self-frustration"],"e":"Self-hatred shows as relentless demands, merciless self-accusation, self-contempt, self-frustration, self-torment and self-destructive impulses."},{"t":"id","q":"Horney found Freud's concept of ___ envy untenable and said there should also be womb envy.","a":["penis","penis envy"],"e":"Horney said psychological differences between men and women come from culture and social expectations, not anatomy."},{"t":"mc","q":"Which is a goal of Horneyian psychotherapy?","o":["Help patients grow to self-realization and give up the idealized self-image","Strengthen the superego","Reduce Thanatos","Reconstruct the style of life"],"e":"Goals include self-realization, giving up the idealized self-image, changing self-hatred to self-acceptance, and focusing on love, mastery and freedom."},{"t":"mc","q":"Robinson et al. (2007) suggested that being a 'successful neurotic' means:","o":["Skill at avoiding negative outcomes improves daily mood","Neuroticism is always harmful","Neurotics seek more information","Neurotic people avoid all anxiety"],"e":"Neurotic skill at avoiding negative outcomes can improve daily mood."},{"t":"mc","q":"According to the critique, Horney's theory is very low on:","o":["Organizing knowledge","Generating research","Internal consistency","Parsimony"],"e":"Horney: moderate on consistency and parsimony; low on falsifiability, research and guiding action; very low on organizing knowledge."}],"fromm":[{"t":"mc","q":"Where and when was Fromm born?","o":["Frankfurt, Germany, 1900","Vienna, Austria, 1870","Eilbek, Germany, 1885","Kesswil, Switzerland, 1875"],"e":"Fromm was born in Frankfurt in 1900 and died in Switzerland in 1980."},{"t":"mc","q":"Fromm was the:","o":["Only child of orthodox Jewish parents","Second son of middle-class Jewish parents","Youngest of four children","Oldest surviving child of a minister"],"e":"He was the only child of orthodox Jewish parents."},{"t":"id","q":"In which field did Fromm receive his PhD in the 1920s?","a":["sociology"],"e":"Fromm received his PhD in sociology, then began studying psychoanalysis in 1925."},{"t":"mc","q":"Fromm founded the South German Institute for Psychoanalysis in:","o":["1930","1925","1934","1950"],"e":"He founded it in 1930, then moved to the U.S. in 1934."},{"t":"mc","q":"In 1934 Fromm moved to the United States and began a psychoanalytic practice in:","o":["New York","Chicago","Boston","Los Angeles"],"e":"He began practice in New York."},{"t":"mc","q":"Fromm said that losing connection with nature and one another results in:","o":["Basic anxiety characterized by loneliness and isolation","Basic hostility toward parents","An inferiority complex","A fixation on the mother"],"e":"The separation brings basic anxiety marked by loneliness and isolation, and the cost of freedom exceeds its benefits."},{"t":"id","q":"In Fromm's 'human dilemma', humans have acquired the ability to ___ about their isolated condition.","a":["reason"],"e":"Humans were torn away from their union with nature but gained the ability to reason about their isolation."},{"t":"mc","q":"Which is NOT one of Fromm's three existential dichotomies?","o":["Nature and nurture","Life and death","Complete self-realization and the fact that life is too short","Being alone yet unable to tolerate isolation"],"e":"The three dichotomies are life and death, self-realization versus a life too short, and aloneness versus the need to belong."},{"t":"id","q":"Name the three basic ways to relate to the world under the need for relatedness.","a":["submission power love"],"e":"Relatedness can take the form of submission, power or love.","k":["submission","power","love"]},{"t":"mc","q":"Which is NOT one of the four basic elements of genuine love in The Art of Loving?","o":["Possession","Care","Respect","Knowledge"],"e":"Genuine love involves care, responsibility, respect and knowledge."},{"t":"id","q":"Which human need is the urge to rise above a passive and accidental existence into the realm of purposefulness and freedom?","a":["transcendence"],"e":"Transcendence can be sought in a positive (creativeness) or ne "People who conform escape aloneness by becoming whatever other people want them to be."},{"t":"mc","q":"Which is NOT one of Fromm's mechanisms of escape from freedom?","o":["Projection","Authoritarianism","Destructiveness","Conformity"],"e":"Fromm's mechanisms of escape: authoritarianism, destructiveness, conformity."},{"t":"mc","q":"Positive freedom is:","o":["Spontaneous and full expression of both rational and emotional potentialities","Giving up independence to gain strength","Doing away with other people","Becoming whatever others want"],"e":"Positive freedom is reached when a person is reunified with others and the world."},{"t":"id","q":"What is the relatively permanent system of noninstinctual strivings through which people relate to the human and natural world?","a":["character"],"e":"People relate through assimilation (acquiring things) and socialization (relating to others)."},{"t":"mc","q":"Which is NOT a nonproductive orientation?","o":["Loving","Receptive","Exploitative","Hoarding"],"e":"Nonproductive: receptive, exploitative, hoarding, marketing. Loving is part of the productive orientation."},{"t":"id","q":"The productive orientation has three dimensions: working, loving and ___.","a":["reasoning"],"e":"Psychologically healthy people work toward positive freedom through working, loving and reasoning."},{"t":"id","q":"Which personality disorder has death as its focus of attention and entails a hatred of humanity?","a":["necrophilia"],"e":"Necrophilia is one of the disorders of the syndrome of decay."},{"t":"mc","q":"Malignant narcissism is the belief that:","o":["Everything one owns is of great value and everything belonging to others is worthless","One must depend entirely on one's mother","Death is the focus of life","One must give up independence"],"e":"That is malignant narcissism."},{"t":"id","q":"What is the term for extreme dependence on one's mother to the point that one's personality blends with hers?","a":["incestuous symbiosis"],"e":"Incestuous symbiosis is an exaggerated form of mother fixation."},{"t":"mc","q":"Fromm's study of a Mexican village found evidence of all character orientations except:","o":["Marketing","Hoarding","Receptive","Exploitative"],"e":"The marketing orientation was the one not found."},{"t":"id","q":"Fromm used psychohistory on which historical figure as an example of the syndrome of decay?","a":["hitler","adolf hitler"],"e":"Fromm traced Hitler's necrophilia, malignant narcissism and incestuous symbiosis."},{"t":"mc","q":"Bernard et al. (2013) found that the more a person's values differ from society's:","o":["The more estranged the person feels","The more creative the person becomes","The more secure the person feels","The more productive the person is"],"e":"Estrangement increased anxiety and depression."},{"t":"mc","q":"According to the critique, Fromm's theory is high on:","o":["Organizing knowledge","Generating research","Falsifiability","Guiding action"],"e":"Fromm: high on organizing knowledge; low on guiding action, consistency and parsimony; very low on generating research and falsifiability."}]};

const SETS = [
  { id: 'general', name: 'General Intro', sub: 'Introduction to personality theory', short: 'General' },
  { id: 'freud', name: 'Sigmund Freud', sub: 'Psychoanalysis', short: 'Freud' },
  { id: 'adler', name: 'Alfred Adler', sub: 'Individual Psychology', short: 'Adler' },
  { id: 'jung', name: 'Carl Jung', sub: 'Analytical Psychology', short: 'Jung' },
  { id: 'klein', name: 'Melanie Klein', sub: 'Object Relations Theory', short: 'Klein' },
  { id: 'horney', name: 'Karen Horney', sub: 'Psychoanalytic Social Theory', short: 'Horney' },
  { id: 'fromm', name: 'Erich Fromm', sub: 'Humanistic Psychoanalysis', short: 'Fromm' }
];
const SECONDS_PER_ITEM = 45;
const STORE_KEY = 'tp-reviewer-v1';

const app = document.getElementById('app');
const settings = { shuffle: true, timed: false };
let S = null;
let timerEl = null;

/* ---------- helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function setInfo(id) { return SETS.find(s => s.id === id); }
function fmt(s) {
  s = Math.max(0, s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
const SMALL = { and: 1, of: 1, the: 1, in: 1, for: 1, or: 1, to: 1, from: 1 };
function titleCase(s) {
  return s.split(' ').map((w, i) => (i > 0 && SMALL[w]) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function loadBest() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function saveBest(id, score, total) {
  try {
    const b = loadBest();
    const pct = Math.round(score / total * 100);
    if (!b[id] || pct > b[id].pct) {
      b[id] = { score: score, total: total, pct: pct };
      localStorage.setItem(STORE_KEY, JSON.stringify(b));
    }
  } catch (e) { /* storage unavailable */ }
}

/* ---------- identification matching ---------- */
function norm(s) {
  s = String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  return s.replace(/^(the|a|an) /, '');
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 99;
  let prev = [];
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function hasKeyword(n, kw) {
  kw = norm(kw);
  if (n.indexOf(kw) !== -1) return true;
  const tol = kw.length >= 9 ? 2 : (kw.length >= 5 ? 1 : 0);
  if (!tol) return false;
  return n.split(' ').some(w => lev(w, kw) <= tol);
}
function matchAnswer(n, accepted) {
  for (const raw of accepted) {
    const a = norm(raw);
    if (!a) continue;
    if (n === a) return true;
    if (a.length >= 4 && (' ' + n + ' ').indexOf(' ' + a + ' ') !== -1) return true;
    const tol = a.length >= 12 ? 2 : (a.length >= 5 ? 1 : 0);
    if (tol && lev(n, a) <= tol) return true;
  }
  return false;
}
function matchID(item, input) {
  const n = norm(input);
  if (!n) return false;
  if (item.k && item.k.length && item.k.every(kw => hasKeyword(n, kw))) return true;
  return matchAnswer(n, item.a || []);
}
function answerText(it) {
  if (it.item.t === 'mc') return it.opts.find(o => o.c).t;
  const d = it.item;
  return d.d || titleCase(d.k && d.k.length ? d.k.join(', ') : d.a[0]);
}

/* ---------- runs ---------- */
function prepare(p) {
  if (p.item.t === 'mc') {
    return { set: p.set, item: p.item, opts: shuffle(p.item.o.map((t, i) => ({ t: t, c: i === 0 }))) };
  }
  return { set: p.set, item: p.item };
}
function startRun(key, title, pool, forceShuffle) {
  stopTimer();
  const order = (settings.shuffle || forceShuffle) ? shuffle(pool.slice()) : pool.slice();
  const items = order.map(prepare);
  S = { key: key, title: title, pool: pool, force: !!forceShuffle, items: items, i: 0, answered: false,
        results: new Array(items.length).fill(null), timed: settings.timed, timeUp: false, timerId: null };
  if (S.timed) {
    S.deadline = Date.now() + items.length * SECONDS_PER_ITEM * 1000;
    S.timerId = setInterval(tick, 1000);
  }
  renderQuiz();
}
function tick() {
  if (!S || !S.timed || S.finished) return;
  const left = Math.ceil((S.deadline - Date.now()) / 1000);
  if (timerEl) {
    timerEl.textContent = fmt(left);
    timerEl.classList.toggle('low', left <= 60);
  }
  if (left <= 0) { S.timeUp = true; finish(); }
}
function stopTimer() {
  if (S && S.timerId) { clearInterval(S.timerId); S.timerId = null; }
}
function mockPool() {
  const pool = [];
  SETS.filter(s => s.id !== 'general').forEach(s => {
    shuffle(DATA[s.id].slice()).slice(0, 10).forEach(item => pool.push({ item: item, set: s.id }));
  });
  return shuffle(pool);
}
function setPool(id) { return DATA[id].map(item => ({ item: item, set: id })); }

/* ---------- home ---------- */
function renderHome() {
  stopTimer();
  S = null;
  timerEl = null;
  const best = loadBest();
  const total = SETS.reduce((n, s) => n + DATA[s.id].length, 0);

  const cards = SETS.map(s => {
    const items = DATA[s.id];
    const nId = items.filter(x => x.t === 'id').length;

      h('span', { class: 'meta' },
        h('span', { text: items.length + ' items · ' + nId + ' identification' }),

  });
  const bm = best.mock;
  cards.push(h('button', { class: 'set wide', type: 'button', onclick: () => startRun('mock', 'Mock midterm', mockPool(), true) },
    h('h3', { text: 'Mock midterm' }),

    h('span', { class: 'meta' },
      h('span', { text: '60 items · multiple choice and identification' }),
      h('span', { class: 'best', text: bm ? 'Best ' + bm.score + '/' + bm.total : 'Not taken yet' }))));

  app.replaceChildren(
    h('header', null,
      h('div', { class: 'masthead' },
        h('h1', { text: 'Theories of Personality' }),
        h('div', { class: 'sem' }, 'Midterm reviewer', h('br'), 'Semester 1 · SY 2026-2027')),
      h('p', { class: 'byline', text: 'Made for Lhyan. Based on your transes for Mr. James Dominic Flores.' })),
    h('div', { class: 'banner', text: 'Options' }),
    h('div', { class: 'settings' },
      h('label', { class: 'check' },
        h('input', { type: 'checkbox', id: 'opt-shuffle', checked: settings.shuffle, onchange: e => { settings.shuffle = e.target.checked; } }),
        h('span', null, 'Shuffle the items', h('small', { text: 'Mix up the order each time you start.' }))),
      h('label', { class: 'check' },
        h('input', { type: 'checkbox', id: 'opt-timed', checked: settings.timed, onchange: e => { settings.timed = e.target.checked; } }),
        h('span', null, 'Timed', h('small', { text: SECONDS_PER_ITEM + ' seconds per item, one clock for the whole set.' })))),
    h('div', { class: 'banner', text: 'Choose a set' }),
    h('div', { class: 'sets' }, cards),
    h('p', { class: 'foot', text: total + ' items in all. Identification answers are not case sensitive and small typos are fine. If a correct answer is marked wrong, you can count it as correct yourself.' }));
  window.scrollTo(0, 0);
}

/* ---------- quiz ---------- */
function renderQuiz() {
  const it = S.items[S.i];
  const n = S.items.length;
  const nCorrect = S.results.filter(r => r && r.ok).length;
  const isMc = it.item.t === 'mc';

  timerEl = S.timed ? h('span', { class: 'timer', text: fmt(Math.ceil((S.deadline - Date.now()) / 1000)) }) : null;
  const quitBox = h('div', { class: 'quitbox', hidden: true },
    h('span', { text: 'Quit this set? Your progress will be lost.' }),
    h('button', { class: 'btn small', type: 'button', onclick: renderHome, text: 'Yes, quit' }),
    h('button', { class: 'btn small ghost', type: 'button', onclick: () => { quitBox.hidden = true; }, text: 'Keep going' }));

  const fb = h('div', { class: 'fb', id: 'fb', 'aria-live': 'polite', hidden: true });
  const nextWrap = h('div', { class: 'next', hidden: true });
  let body;

  if (isMc) {
    body = h('div', { class: 'opts', role: 'group', 'aria-label': 'Answer choices' },
      it.opts.map((o, idx) => h('button', { class: 'opt', type: 'button', onclick: () => chooseMC(idx) },
        h('span', { class: 'letter', text: 'ABCD'.charAt(idx) }),
        h('span', { class: 'otext', text: o.t }))));
  } else {
    const input = h('input', { class: 'field', id: 'ans', type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', 'aria-label': 'Your answer', placeholder: 'Type your answer' });
    const hint = h('p', { class: 'hint', id: 'hint' });
    body = h('form', { onsubmit: e => { e.preventDefault(); submitID(false); } },
      input,
      hint,
      h('div', { class: 'actions', id: 'idactions' },
        h('button', { class: 'btn', type: 'submit', text: 'Check answer' }),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => submitID(true), text: "I don't know" })));
  }

  const pills = [h('span', { class: 'pill type', text: isMc ? 'Multiple choice' : 'Identification' })];
  if (S.key === 'mock' || S.key === null) pills.push(h('span', { class: 'pill', text: setInfo(it.set).short }));

  const bar = h('i');
  bar.style.width = (S.i / n * 100) + '%';

  app.replaceChildren(
    h('div', { class: 'topbar' },
      h('button', { class: 'btn small ghost', type: 'button', onclick: () => { quitBox.hidden = !quitBox.hidden; }, text: 'Quit' }),
      h('span', { class: 'name', text: S.title }),
      timerEl || h('span')),
    quitBox,
    h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(n), 'aria-valuenow': String(S.i) }, bar),
    h('div', { class: 'counter' }, h('span', { text: 'Item ' + (S.i + 1) + ' of ' + n }), h('span', { text: nCorrect + ' correct so far' })),
    h('section', { class: 'card' },
      h('div', { class: 'pills' }, pills),
      h('p', { class: 'q', text: it.item.q }),
      body,
      fb,
      nextWrap));
  if (!isMc) document.getElementById('ans').focus();
  window.scrollTo(0, 0);
}

function showFeedback(ok, extra) {
  const it = S.items[S.i];
  const fb = document.getElementById('fb');
  fb.hidden = false;
  fb.className = 'fb ' + (ok ? 'ok' : 'no');
  const kids = [h('p', { class: 'verdict', text: ok ? 'Correct' : 'Not quite' })];
  if (extra) kids.push(extra);
  if (!(ok && it.item.t === 'mc')) kids.push(h('p', null, h('strong', { text: 'Answer: ' }), answerText(it)));
  kids.push(h('p', { class: 'why', text: it.item.e }));
  fb.replaceChildren(...kids);

  const last = S.i === S.items.length - 1;
  const nextWrap = document.querySelector('.next');
  nextWrap.hidden = false;
  const btn = h('button', { class: 'btn', id: 'nextbtn', type: 'button', onclick: advance, text: last ? 'See results' : 'Next item' });
  nextWrap.replaceChildren(btn);
  btn.focus();
}

function chooseMC(idx) {
  if (S.answered) return;
  const it = S.items[S.i];
  const ok = it.opts[idx].c;
  S.answered = true;
  S.results[S.i] = { ok: ok, given: it.opts[idx].t };
  document.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (it.opts[i].c) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  showFeedback(ok, null);
  refreshCount();
}

function submitID(skip) {
  if (S.answered) return;
  const it = S.items[S.i];
  const input = document.getElementById('ans');
  const value = input.value.trim();
  if (!skip && !value) {
    document.getElementById('hint').textContent = "Type an answer first, or tap I don't know.";
    input.focus();
    return;
  }
  const ok = skip ? false : matchID(it.item, value);
  S.answered = true;
  S.results[S.i] = { ok: ok, given: skip ? '' : value, skipped: skip };
  input.disabled = true;
  input.classList.add(ok ? 'ok' : 'bad');
  document.getElementById('hint').textContent = '';
  document.getElementById('idactions').hidden = true;
  let extra = null;
  if (!ok && !skip) {
    extra = h('p', null, 'You wrote: ', h('strong', { text: value }), ' ',
      h('button', { class: 'btn small ghost', type: 'button', onclick: () => overrideCorrect(), text: 'Count it as correct' }));
  }
  showFeedback(ok, extra);
  refreshCount();
}

function overrideCorrect() {
  const r = S.results[S.i];
  if (!r || r.ok) return;
  r.ok = true;
  r.override = true;
  const input = document.getElementById('ans');
  input.classList.remove('bad');
  input.classList.add('ok');
  showFeedback(true, h('p', { text: 'Counted as correct. You wrote: ' + r.given }));
  refreshCount();
}

function refreshCount() {
  const c = document.querySelector('.counter span:last-child');
  if (c) c.textContent = S.results.filter(r => r && r.ok).length + ' correct so far';
}

function advance() {
  if (!S || !S.answered) return;
  if (S.i < S.items.length - 1) {
    S.i++;
    S.answered = false;
    renderQuiz();
  } else {
    finish();
  }
}

/* ---------- results ---------- */
function finish() {
  if (!S || S.finished) return;
  stopTimer();
  S.items.forEach((it, i) => {
    if (!S.results[i]) S.results[i] = { ok: false, given: '', unanswered: true };
  });
  S.finished = true;
  const total = S.items.length;
  S.score = S.results.filter(r => r.ok).length;
  if (S.key) saveBest(S.key, S.score, total);
  renderResult();
}

function tally(filterFn) {
  let ok = 0, n = 0;
  S.items.forEach((it, i) => { if (filterFn(it)) { n++; if (S.results[i].ok) ok++; } });
  return { ok: ok, n: n };
}
function barRow(label, t) {
  const bar = h('i');
  bar.style.width = (t.n ? t.ok / t.n * 100 : 0) + '%';
  return h('div', { class: 'row' }, h('span', { text: label }), h('div', { class: 'track' }, bar), h('span', { class: 'n', text: t.ok + '/' + t.n }));
}

function renderResult() {
  const total = S.items.length;
  const pct = Math.round(S.score / total * 100);
  let verdict, sweet;
  if (pct >= 90) { verdict = 'Ready for the midterm'; sweet = 'Proud of you, Lhyan. Go get that midterm.'; }
  else if (pct >= 75) { verdict = 'Passing, keep polishing'; sweet = 'You are close. Review the misses below and you will be even more ready. You have got this, Lhyan.'; }
  else if (pct >= 50) { verdict = 'Getting there'; sweet = 'Every miss you review now is one you will not make on the exam. You have got this, Lhyan.'; }
  else { verdict = 'Back to the transes, then retry'; sweet = 'A low score today is just information. Read the explanations, try again, and watch it climb. You have got this, Lhyan.'; }

  const missed = S.items.map((it, i) => ({ it: it, r: S.results[i] })).filter(x => !x.r.ok);
  const mc = tally(it => it.item.t === 'mc');
  const idn = tally(it => it.item.t === 'id');

  const sections = [];
  sections.push(h('div', { class: 'banner', text: S.title + ' results' }));
  sections.push(h('div', { class: 'scorebox' },
    h('div', { class: 'score' }, String(S.score), h('small', { text: '/' + total })),
    h('div', null,
      h('p', { class: 'verdict-line', text: verdict }),
      h('p', { class: 'sweet', text: pct + '%. ' + (S.timeUp ? "Time ran out, so unanswered items count as missed. " : '') + 'Reference passing mark: 75%.' }))));
  sections.push(h('p', { class: 'sweet', text: sweet }));

  sections.push(h('div', { class: 'banner', text: 'Breakdown' }));
  const rows = [barRow('Multiple choice', mc), barRow('Identification', idn)];
  if (S.key === 'mock') {
    SETS.filter(s => s.id !== 'general').forEach(s => rows.push(barRow(s.short, tally(it => it.set === s.id))));
  }
  sections.push(h('div', { class: 'rows' }, rows));

  sections.push(h('div', { class: 'banner', text: missed.length ? 'Review your misses (' + missed.length + ')' : 'No misses' }));
  if (missed.length) {
    sections.push(h('div', { class: 'missed' }, missed.map(x => {
      const given = x.r.unanswered ? 'No answer' : (x.r.skipped ? "Skipped (I don't know)" : x.r.given);
      return h('details', null,
        h('summary', { text: x.it.item.q }),
        h('p', null, h('strong', { text: 'Your answer: ' }), given),
        h('p', null, h('strong', { text: 'Correct answer: ' }), answerText(x.it)),
        h('p', { class: 'why', text: x.it.item.e }));
    })));
  } else {
    sections.push(h('p', { class: 'sweet', text: 'Perfect run. Try the mock midterm next.' }));
  }

  const actions = [];
  if (missed.length) {
    actions.push(h('button', { class: 'btn', type: 'button', onclick: () => startRun(null, 'Missed items', missed.map(x => ({ item: x.it.item, set: x.it.set }))), text: 'Retake missed items (' + missed.length + ')' }));
  }
  actions.push(h('button', { class: missed.length ? 'btn ghost' : 'btn', type: 'button', onclick: () => startRun(S.key, S.title, S.pool, S.force), text: 'Retake this set' }));
  actions.push(h('button', { class: 'btn ghost', type: 'button', onclick: renderHome, text: 'All sets' }));
  sections.push(h('div', { class: 'endactions' }, actions));

  app.replaceChildren(
    h('header', null, h('div', { class: 'masthead' }, h('h1', { text: 'Theories of Personality' }), h('div', { class: 'sem' }, 'Midterm reviewer'))),
    ...sections);
  window.scrollTo(0, 0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!S || S.finished || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('button, input, summary, a')) return;
  const it = S.items[S.i];
  if (!S.answered && it.item.t === 'mc') {
    const k = e.key.toLowerCase();
    const idx = '1234'.indexOf(k) !== -1 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
    if (k.length === 1 && idx !== -1) { e.preventDefault(); chooseMC(idx); }
  } else if (S.answered && (e.key === 'Enter' || e.key === 'ArrowRight')) {
    e.preventDefault();
    advance();
  }
});

renderHome();
</script>

</body></html>
